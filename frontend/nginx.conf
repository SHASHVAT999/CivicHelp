server {
    listen 80;
    server_name _;
    client_max_body_size 6M;   # photos are limited to 5 MB by the backend
    server_tokens off;         # do not advertise the Nginx version

    # Basic browser security headers (sent on every response, including errors)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React single-page app: unknown paths (/dashboard, /map ...) are handled by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS files have content hashes in their names, so they can be cached for a long time
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # REST API -> Express container
    location /api {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO real-time updates (WebSocket upgrade, falls back to long-polling)
    location /socket.io {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Uploaded photos (stored in the uploads-data volume by the backend)
    location /uploads {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
